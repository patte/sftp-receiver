services:
  sftp:
    build: .
    ports:
      - "2222:22"
    volumes:
      - ./consume:/data/consume
      - ./sftp-receiver:/var/sftp-receiver
    # a compromised sshd is root in the container: keep only what sshd and the watcher need
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
