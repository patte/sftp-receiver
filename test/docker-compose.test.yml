services:
  sftp:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${TEST_SFTP_PORT:-3022}:22"
    volumes:
      - ./tmp/sftp-receiver:/var/sftp-receiver
      - ./tmp/consume:/data/consume
    # the capabilities from the README, so the tests prove they suffice
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
